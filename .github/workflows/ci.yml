name: ci

# Tests and lint on every push and PR.
#
# This repo shipped its first release with only docs and CodeQL workflows, meaning
# nothing verified that the safety envelope still worked before code landed on main.
# For a package whose entire purpose is refusing dangerous commands to a 375 °C
# machine, "the tests passed on my laptop" is not a control.
#
# The suite is mock-only and tests/conftest.py fails any test that opens a socket to
# a non-loopback address, so a CI run cannot reach a printer even if the config
# pointed at one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject; 3.12 is the newest tested.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install
        run: uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest -q

  safety-invariants:
    # The claims the README makes, asserted rather than trusted. If a tool loses
    # its annotation or the destructive count drifts, that is a safety regression
    # and should fail here, not be noticed in a review.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Every tool is annotated, and the counts match the README
        env:
          QIDI_TEST_MODE: "1"
          QIDI_READ_ONLY: "1"
        run: |
          uv run python scripts/introspect.py > /tmp/tools.json
          uv run python - <<'PY'
          import json, pathlib, re, sys

          data = json.loads(pathlib.Path("/tmp/tools.json").read_text())
          tools = data["tools"]
          total = len(tools)
          read_only = sum(1 for t in tools if t["read_only"])
          destructive = sum(1 for t in tools if t["destructive"])
          unannotated = [t["name"] for t in tools if t.get("read_only") is None]
          print(f"{total} tools, {read_only} read-only, {destructive} destructive-annotated")

          problems = []
          if unannotated:
              # An unannotated tool is invisible to the read-only sweep in
              # tests/test_safety.py, so it could mutate the printer unchecked.
              problems.append(f"unannotated tools: {unannotated}")

          # A doc that confidently names a tool count the server does not have is
          # worse than no doc. README.md is the one place that count is written.
          text = pathlib.Path("README.md").read_text()
          found = re.search(r"(\d+) tools in \w+ modules", text)
          if not found:
              problems.append("README.md: could not find the tool count to verify")
          elif int(found.group(1)) != total:
              problems.append(f"README.md claims {found.group(1)} tools, server has {total}")

          # emergency_stop carries the destructive *annotation* (it does destroy the
          # print) but must never be token-gated. The behavioural half of this is
          # tested in tests/test_safety.py; here we only assert it still exists and
          # is not mislabelled as a read-only tool.
          stop = next((t for t in tools if t["name"] == "emergency_stop"), None)
          if stop is None:
              problems.append("emergency_stop is missing entirely")
          elif stop["read_only"]:
              problems.append("emergency_stop is annotated read-only, which is a lie")

          if problems:
              sys.exit("safety invariants failed:\n  " + "\n  ".join(problems))
          print("safety invariants hold")
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheel and sdist
        run: uv build

      - name: The wheel must carry both entry points and the dashboard page
        run: |
          uv run python - <<'PY'
          import glob, sys, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          entry = next((n for n in names if n.endswith("entry_points.txt")), None)
          text = zipfile.ZipFile(wheel).read(entry).decode() if entry else ""
          missing = [
              what
              for what, ok in (
                  ("qidi-mcp entry point", "qidi-mcp =" in text),
                  ("qidi-dashboard entry point", "qidi-dashboard =" in text),
                  ("dashboard_page module", any("dashboard_page.py" in n for n in names)),
              )
              if not ok
          ]
          if missing:
              sys.exit(f"wheel {wheel} is missing: {missing}")
          print(f"{wheel} is complete")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
